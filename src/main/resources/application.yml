spring:
  application:
    name: edujacksons

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edujacksons}
    username: ${DB_USER:edujacksons}
    password: ${DB_PASSWORD:edujacksons}

  jpa:
    hibernate:
      ddl-auto: validate          # схемой владеет Flyway, Hibernate только проверяет
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    # Конвейер проверки submissions → judge. Значения событий — JSON; тип берётся из заголовка
    # __TypeId__ (JsonSerializer проставляет), поэтому один consumer-factory обслуживает оба топика.
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "dev.edujacksons.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Redis (кэш/сессии) пока не используется — подключается лениво, приложение стартует без него.
# Kafka с Фазы 2 нужна для проверки решений: без брокера @KafkaListener'ы не поднимут соединение
# (приложение при этом стартует), а отправка решений «зависнет» в статусе QUEUED.

app:
  jwt:
    # В проде секрет ОБЯЗАТЕЛЬНО из окружения. Дефолт — только для локальной разработки.
    secret: ${JWT_SECRET:dev-secret-change-me-please-min-32-bytes-long}
    expiration: ${JWT_EXPIRATION:PT24H}
    issuer: edujacksons

  judge0:
    # Self-hosted Judge0 (docker-compose, профиль judge0). В проде — адрес из окружения.
    base-url: ${JUDGE0_URL:http://localhost:2358}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
