spring:
  application:
    name: edujacksons

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edujacksons}
    username: ${DB_USER:edujacksons}
    password: ${DB_PASSWORD:edujacksons}

  jpa:
    hibernate:
      ddl-auto: validate          # схемой владеет Flyway, Hibernate только проверяет
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

# Инфраструктура (Redis/Kafka) подключается лениво — на Фазе 0 ещё не используется,
# приложение стартует без запущенных Redis/Kafka.

app:
  jwt:
    # В проде секрет ОБЯЗАТЕЛЬНО из окружения. Дефолт — только для локальной разработки.
    secret: ${JWT_SECRET:dev-secret-change-me-please-min-32-bytes-long}
    expiration: ${JWT_EXPIRATION:PT24H}
    issuer: edujacksons

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
