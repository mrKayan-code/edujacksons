# Локальный инфраструктурный стек EduJacksons.
# Запуск: docker compose up -d
# Приложение (пока) запускается на хосте и ходит в эти сервисы по localhost.
# Значения совпадают с дефолтами application.yml.

services:
  postgres:
    image: postgres:16-alpine
    container_name: edu-postgres
    environment:
      POSTGRES_DB: edujacksons
      POSTGRES_USER: edujacksons
      POSTGRES_PASSWORD: edujacksons
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edujacksons -d edujacksons"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: edu-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    container_name: edu-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft single-node (без ZooKeeper): один узел совмещает роли controller+broker.
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafkadata:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── Judge0 (опционально, профиль judge0) ──────────────────────────────────────
  # Запуск: docker compose --profile judge0 up -d
  # Тяжёлый стек (свои postgres+redis+воркеры), требует privileged + доступ к cgroups для
  # изоляции исполнения. Для интеграционных тестов НЕ нужен — там CodeExecutor подменяется fake.
  # Значения — отправная точка; тонкая настройка Judge0 — тема сессии деплоя (task.md §9).
  judge0:
    image: judge0/judge0:1.13.1
    container_name: edu-judge0
    profiles: ["judge0"]
    ports:
      - "2358:2358"
    privileged: true
    environment: &judge0-env
      REDIS_HOST: judge0-redis
      REDIS_PORT: "6379"
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
    depends_on:
      - judge0-db
      - judge0-redis
    restart: unless-stopped

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: edu-judge0-workers
    profiles: ["judge0"]
    command: ["./scripts/workers"]
    privileged: true
    environment: *judge0-env
    depends_on:
      - judge0-db
      - judge0-redis
    restart: unless-stopped

  judge0-db:
    image: postgres:16-alpine
    container_name: edu-judge0-db
    profiles: ["judge0"]
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
    volumes:
      - judge0-pgdata:/var/lib/postgresql/data

  judge0-redis:
    image: redis:7-alpine
    container_name: edu-judge0-redis
    profiles: ["judge0"]
    command: ["redis-server", "--appendonly", "no"]

volumes:
  pgdata:
  redisdata:
  kafkadata:
  judge0-pgdata:
